name: Friend.ly
description: >-
  Friend.ly was a social question-and-answer service that let people meet and
  connect by answering fun, get-to-know-you questions, launched around 2010 by a
  team led by Ed Baker. It raised roughly $5M from Lightspeed Ventures, Balderton
  Capital, SoftTech VC (now Uncork Capital), and a range of angels, and was
  acquired by Facebook (now Meta) on October 10, 2011 — primarily an acqui-hire,
  with the founding team moving to Facebook to work on growth and new products.
  The consumer service was wound down after the acquisition. This profile is
  retained in the API Evangelist network as a historical portfolio-company record
  for Uncork Capital; the friend.ly domain is now parked and the company operates
  no public API, developer portal, or documentation surface.
